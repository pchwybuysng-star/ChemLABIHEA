:root {

* {
  box-sizing: border-box;
}

body {
  font-family: var(--font-sans);
  overflow-x: hidden;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(15, 23, 42, 0.4);
}
::-webkit-scrollbar-thumb {
  background: rgba(100, 116, 139, 0.5);
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(148, 163, 184, 0.8);
}

/* Glass Test Tube Styling & Animations */
.tube-wrapper {
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
}
.tube-wrapper:hover {
  transform: translateY(-4px);
}
.tube-wrapper.selected-tube {
  transform: translateY(-8px) scale(1.03);
  filter: drop-shadow(0 12px 24px rgba(56, 189, 248, 0.35));
}

@keyframes dropFall {
  0% {
    transform: translateY(-35px) scale(0.8);
    opacity: 1;
  }
  75% {
    transform: translateY(55px) scale(1.05, 1.25);
    opacity: 1;
  }
  100% {
    transform: translateY(72px) scale(1.6, 0.3);
    opacity: 0;
  }
}

.reagent-drop {
  animation: dropFall 0.55s cubic-bezier(0.45, 0, 0.85, 0.5) forwards;
}

@keyframes bubbleRise {
  0% {
    transform: translateY(0) scale(0.6);
    opacity: 0.85;
  }
  100% {
    transform: translateY(-75px) scale(1.25);
    opacity: 0;
  }
}

.gas-bubble {
  animation: bubbleRise 1.2s ease-in infinite;
}

@keyframes centrifugeSpin {
  0% {
    transform: rotate(0deg);
  }
  25% {
    transform: rotate(8deg) translateX(3px);
  }
  50% {
    transform: rotate(0deg);
  }
  75% {
    transform: rotate(-8deg) translateX(-3px);
  }
  100% {
    transform: rotate(0deg);
  }
}

.spinning-tube {
  animation: centrifugeSpin 0.12s linear infinite;
}

@keyframes heatGlow {
  0%, 100% {
    filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.6));
  }
  50% {
    filter: drop-shadow(0 0 24px rgba(239, 68, 68, 0.9));
  }
}

.heating-tube {
  animation: heatGlow 1s ease-in-out infinite;
}

/* Subtle Grid Background for Virtual Lab Bench */
.lab-bench-bg {
  background-color: #0b1120;
  background-image: 
    radial-gradient(at 15% 15%, rgba(236, 72, 153, 0.08) 0px, transparent 50%),

.flow-node {

.flow-node:hover {

.reagent-btn:active:not(:disabled) {

// ============================================================================
// DYNAMIC TEST TUBE SIMULATION ENGINE
// ============================================================================
class VirtualTube {
  constructor(config = {}) {
    this.id = config.id || "tube-" + Math.random().toString(36).slice(2, 7);
    this.name = config.name || "หลอดที่ 1";
    this.subtitle = config.subtitle || "สารละลายตัวอย่าง (1 mL)";
    // Aqueous species present in solution
    this.aq = new Set(config.aq || []);
    // Solid precipitates present in tube: array of { id, formula, label, color, border, style, amount }
    this.ppts = config.ppts ? JSON.parse(JSON.stringify(config.ppts)) : [];
    // Chemical environment
    this.pH = config.pH || "neutral"; // 'acidic', 'weak_acidic', 'neutral', 'basic', 'ammoniacal'
    this.acidType = config.acidType || "none"; // 'HCl', 'HNO3', 'aqua_regia', 'CH3COOH'
    this.hasCl = Boolean(config.hasCl);
    this.hasH2O2 = Boolean(config.hasH2O2);
    this.hasCrO4Reagent = Boolean(config.hasCrO4Reagent);
    this.temperature = config.temperature || "rt"; // 'rt' | 'hot'
    this.centrifuged = Boolean(config.centrifuged);
    this.washed = Boolean(config.washed);
    this.bubbles = Boolean(config.bubbles);
    this.volume = config.volume || 1.0; // mL
    this.logs = config.logs ? [...config.logs] : [];
    this.lastEquation = config.lastEquation || "";
    this.lastObservation = config.lastObservation || "สารละลายเริ่มต้นพร้อมทำการทดลอง";
  }

  clone(newName, newSubtitle) {
    return new VirtualTube({
      name: newName || this.name + " (แบ่ง)",
      subtitle: newSubtitle || this.subtitle,
      aq: Array.from(this.aq),
      ppts: this.ppts,
      pH: this.pH,
      acidType: this.acidType,
      hasCl: this.hasCl,
      hasH2O2: this.hasH2O2,
      hasCrO4Reagent: this.hasCrO4Reagent,
      temperature: this.temperature,
      centrifuged: this.centrifuged,
      washed: this.washed,
      bubbles: false,
      volume: Math.max(0.5, +(this.volume / 2).toFixed(1)),
      logs: [...this.logs],
      lastEquation: this.lastEquation,
      lastObservation: this.lastObservation
    });
  }

  hasPpt(id) {
    return this.ppts.some(p => p.id === id);
  }

  addPpt(pptObj) {
    const existing = this.ppts.find(p => p.id === pptObj.id);
    if (!existing) {
      this.ppts.push(pptObj);
    }
    this.centrifuged = false;
  }

  removePpt(id) {
    this.ppts = this.ppts.filter(p => p.id !== id);
  }

  // Compute realistic liquid color based on aqueous species
  getLiquidColor() {
    if (this.aq.has("[Fe(SCN)]2+")) return "rgba(153, 27, 27, 0.94)"; // Blood red
    if (this.aq.has("MnO4-")) return "rgba(162, 28, 175, 0.86)"; // Permanganate purple-red
    if (this.aq.has("CrO5_blue")) return "rgba(29, 78, 216, 0.85)"; // Deep blue CrO5
    if (this.aq.has("Al_CV_complex")) return "rgba(37, 99, 235, 0.82)"; // Catechol violet + Al3+ blue
    if (this.aq.has("[Ni(NH3)6]2+")) return "rgba(59, 130, 246, 0.68)"; // Royal blue-violet
    if (this.aq.has("Cr2O7_2-")) return "rgba(249, 115, 22, 0.72)"; // Orange dichromate
    if (this.aq.has("CrO4_2-") || this.hasCrO4Reagent) return "rgba(250, 204, 21, 0.65)"; // Bright yellow chromate
    if (this.aq.has("[Cr(OH)4]-")) return "rgba(34, 197, 94, 0.50)"; // Deep green chromite
    if (this.aq.has("Fe3+") && this.aq.has("Ni2+")) return "rgba(163, 230, 53, 0.45)"; // Yellow + Green
    if (this.aq.has("Fe3+")) return "rgba(250, 204, 21, 0.48)"; // Yellow Fe3+
    if (this.aq.has("Cr3+")) return "rgba(20, 184, 166, 0.48)"; // Blue-green Cr3+
    if (this.aq.has("Ni2+")) return "rgba(74, 222, 128, 0.38)"; // Pale green Ni2+
    if (this.aq.has("Mn2+")) return "rgba(251, 207, 232, 0.22)"; // Very pale pink Mn2+
    if (this.aq.has("CatecholViolet_free")) return "rgba(168, 85, 247, 0.38)"; // Violet-amber indicator
    return "rgba(226, 232, 240, 0.18)"; // Colorless
  }

  // Apply a reagent or action to this test tube and return { obs, eq, type }
  applyReagent(reagentId) {
    this.bubbles = false;
    let observations = [];
    let equations = [];
    this.volume = Math.min(4.0, +(this.volume + 0.3).toFixed(1));

    // ------------------------------------------------------------------------
    // 1. 6 M HCl
    // ------------------------------------------------------------------------
    if (reagentId === "HCl_6M") {
      this.hasCl = true;
      this.pH = "acidic";
      this.acidType = this.acidType === "HNO3" ? "aqua_regia" : "HCl";

      // Re-precipitate [Ag(NH3)2]+ if present
      if (this.aq.has("[Ag(NH3)2]+")) {
        this.aq.delete("[Ag(NH3)2]+");
        this.addPpt({ id: "AgCl", formula: "AgCl(s)", label: "AgCl(s) ตะกอนขาว", color: "#f8fafc", border: "#cbd5e1", style: "curdy" });
        observations.push("เกิดตะกอนสีขาวของ AgCl(s) กลับคืนมาเมื่อสารละลายเป็นกรด");
        equations.push("[Ag(NH₃)₂]⁺(aq) + Cl⁻(aq) + 2H⁺(aq) → AgCl(s)↓ + 2NH₄⁺(aq)");
      }

      // Precipitate Group 1 cations (Ag+, Pb2+, Hg2_2+)
      if (this.aq.has("Ag+")) {
        this.aq.delete("Ag+");
        this.addPpt({ id: "AgCl", formula: "AgCl(s)", label: "AgCl(s) ตะกอนขาว", color: "#f8fafc", border: "#cbd5e1", style: "curdy" });
        observations.push("เกิดตะกอนสีขาวของ AgCl(s)");
        equations.push("Ag⁺(aq) + Cl⁻(aq) → AgCl(s)↓");
      }
      if (this.aq.has("Pb2+") && this.temperature !== "hot") {
        this.aq.delete("Pb2+");
        this.addPpt({ id: "PbCl2", formula: "PbCl₂(s)", label: "PbCl₂(s) ตะกอนขาว", color: "#f8fafc", border: "#cbd5e1", style: "crystalline" });
        observations.push("เกิดตะกอนสีขาวของ PbCl₂(s)");
        equations.push("Pb²⁺(aq) + 2Cl⁻(aq) → PbCl₂(s)↓");
      }
      if (this.aq.has("Hg2_2+")) {
        this.aq.delete("Hg2_2+");
        this.addPpt({ id: "Hg2Cl2", formula: "Hg₂Cl₂(s)", label: "Hg₂Cl₂(s) ตะกอนขาว", color: "#f8fafc", border: "#cbd5e1", style: "dense" });
        observations.push("เกิดตะกอนสีขาวของ Hg₂Cl₂(s)");
        equations.push("Hg₂²⁺(aq) + 2Cl⁻(aq) → Hg₂Cl₂(s)↓");
      }

      // Convert hydroxo / ammine complexes back to free ions in acid
      if (this.aq.has("[Zn(NH3)4]2+") || this.aq.has("[Zn(OH)4]2-")) {

        this.aq.delete("[Zn(OH)4]2-");

        equations.push("[Zn(NH₃)₄]²⁺(aq) + 4H⁺(aq) → Zn²⁺(aq) + 4NH₄⁺(aq)");
      }
      if (this.aq.has("[Al(OH)4]-")) {
        this.aq.delete("[Al(OH)4]-");
        this.aq.add("Al3+");
        observations.push("เปลี่ยน [Al(OH)₄]⁻ เป็น Al³⁺(aq)");
        equations.push("[Al(OH)₄]⁻(aq) + 4H⁺(aq) → Al³⁺(aq) + 4H₂O(l)");
      }
      if (this.aq.has("[Ni(NH3)6]2+")) {
        this.aq.delete("[Ni(NH3)6]2+");
        this.aq.add("Ni2+");
        observations.push("สารละลายเปลี่ยนจากสีน้ำเงินกลับเป็นสีเขียวอ่อนของ Ni²⁺(aq)");
      }

      // Dissolve Group 2/3 hydroxide precipitates
      if (this.hasPpt("Fe(OH)3")) {

        equations.push("Fe(OH)₃(s) + 3H⁺(aq) → Fe³⁺(aq) + 3H₂O(l)");
      }
      if (this.hasPpt("Ni(OH)2")) {
        this.removePpt("Ni(OH)2");
        this.aq.add("Ni2+");
        observations.push("ตะกอนสีเขียว Ni(OH)₂ ละลาย ได้สารละลายสีเขียวอ่อนของ Ni²⁺(aq)");
        equations.push("Ni(OH)₂(s) + 2H⁺(aq) → Ni²⁺(aq) + 2H₂O(l)");
      }
      if (this.hasPpt("MnO2")) {
        this.removePpt("MnO2");
        this.aq.add("Mn2+");
        this.bubbles = true;
        observations.push("ตะกอนสีดำ MnO₂·xH₂O ละลายในกรด HCl ได้สารละลายใสของ Mn²⁺(aq) และแก๊ส Cl₂");
        equations.push("MnO₂·2H₂O(s) + 2Cl⁻(aq) + 4H⁺(aq) → Mn²⁺(aq) + 4H₂O(l) + Cl₂(g)↑");
      }
      if (this.hasPpt("Al(OH)3")) {
        this.removePpt("Al(OH)3");
        this.aq.add("Al3+");

        equations.push("Al(OH)₃(s) + 3H⁺(aq) → Al³⁺(aq) + 3H₂O(l)");
      }

      if (observations.length === 0) {
        observations.push("ไม่เกิดตะกอนกับ 6 M HCl (ไม่มีแคทไอออนกลุ่มที่ 1 หรือตะกอนตกหมดแล้ว) สารละลายมีฤทธิ์เป็นกรด");
      }
    }

    // ------------------------------------------------------------------------
    // 2. 6 M HNO3
    // ------------------------------------------------------------------------
    else if (reagentId === "HNO3_6M") {
      this.pH = "acidic";
      this.acidType = this.acidType === "HCl" ? "aqua_regia" : "HNO3";

      if (this.aq.has("[Ag(NH3)2]+")) {
        this.aq.delete("[Ag(NH3)2]+");
        this.addPpt({ id: "AgCl", formula: "AgCl(s)", label: "AgCl(s) ตะกอนขาว", color: "#f8fafc", border: "#cbd5e1", style: "curdy" });
        observations.push("เกิดตะกอนสีขาวของ AgCl(s) กลับคืนมา! ยืนยันว่ามี Ag⁺");

        equations.push("2BaCrO₄(s) + 2H⁺(aq) → Cr₂O₇²⁻(aq) (สีส้ม) + 2Ba²⁺(aq) + H₂O(l)");
      }
      if (this.aq.has("CrO4_2-")) {
        this.aq.delete("CrO4_2-");
        this.aq.add("Cr2O7_2-");
        observations.push("สารละลายสีเหลือง CrO₄²⁻ เปลี่ยนเป็นสารละลายสีส้มของ Cr₂O₇²⁻ ในกรด");
        equations.push("2CrO₄²⁻(aq) + 2H⁺(aq) → Cr₂O₇²⁻(aq) + H₂O(l)");
      }
      if (this.hasPpt("Ni(OH)2")) {
        this.removePpt("Ni(OH)2");
        this.aq.add("Ni2+");
        observations.push("ตะกอนสีเขียว Ni(OH)₂ ละลายในกรด ได้ Ni²⁺(aq)");
        equations.push("Ni(OH)₂(s) + 2H⁺(aq) → Ni²⁺(aq) + 2H₂O(l)");
      }
      if (this.hasPpt("Fe(OH)3")) {
        this.removePpt("Fe(OH)3");
        this.aq.add("Fe3+");
        observations.push("ตะกอนสีน้ำตาลแดง Fe(OH)₃ ละลายในกรด ได้สารละลายสีเหลืองของ Fe³⁺(aq)");
        equations.push("Fe(OH)₃(s) + 3H⁺(aq) → Fe³⁺(aq) + 3H₂O(l)");

      if (this.hasPpt("MnO2") && this.hasCl) {

    // ------------------------------------------------------------------------
    // 3. 6 M CH3COOH

    else if (reagentId === "CH3COOH_6M") {

    // ------------------------------------------------------------------------
    // 4. 6 M NaOH (Excess)

    else if (reagentId === "NaOH_6M") {

        this.aq.delete("Fe3+");

          observations.push("เกิดตะกอนสีครีมของ Mn(OH)₂(s) (เมื่อเติม 3% H₂O₂ หรือถูกออกซิไดส์จะเปลี่ยนเป็นตะกอนสีดำ MnO₂·xH₂O)");
          equations.push("Mn²⁺(aq) + 2OH⁻(aq) → Mn(OH)₂(s)↓ (ตะกอนสีครีม)");
        }
      }

      // Group 3 Hydroxo complexes
      if (this.aq.has("Al3+") || this.hasPpt("Al(OH)3")) {
        this.aq.delete("Al3+");
        this.removePpt("Al(OH)3");
        this.aq.add("[Al(OH)4]-");
        observations.push("Al³⁺ เกิดสารเชิงซ้อนไฮดรอกโซ [Al(OH)₄]⁻(aq) ได้สารละลายใสไม่มีสี");
        equations.push("Al³⁺(aq) + 4OH⁻(aq) → [Al(OH)₄]⁻(aq)");
      }
      if (this.aq.has("Zn2+") || this.aq.has("[Zn(NH3)4]2+")) {
        this.aq.delete("Zn2+");
        this.aq.delete("[Zn(NH3)4]2+");
        this.aq.add("[Zn(OH)4]2-");

        equations.push("Zn²⁺(aq) + 4OH⁻(aq) → [Zn(OH)₄]²⁻(aq)");
      }
      if (this.aq.has("Cr3+")) {
        this.aq.delete("Cr3+");
        if (this.hasH2O2) {

      if (this.hasPpt("PbCrO4")) {

        this.aq.add("CrO4_2-");

        equations.push("PbCrO₄(s) + 4OH⁻(aq) → [Pb(OH)₄]²⁻(aq) (ไม่มีสี) + CrO₄²⁻(aq) (สีเหลือง)");

        equations.push("K₂Zn₃[Fe(CN)₆]₂(s) + 12OH⁻(aq) → 2[Fe(CN)₆]⁴⁻(aq) + 3[Zn(OH)₄]²⁻(aq) + 2K⁺(aq)");
      }

      if (observations.length === 0) {

      }
    }

    // 5. 6 M NH3
    // ------------------------------------------------------------------------
    else if (reagentId === "NH3_6M") {

      if (this.aq.has("Al3+")) {

        observations.push("เกิดตะกอนวุ้นสีขาวของ Al(OH)₃(s)");
        equations.push("Al³⁺(aq) + 3NH₃(aq) + 3H₂O(l) → Al(OH)₃(s)↓ (ตะกอนวุ้นขาว) + 3NH₄⁺(aq)");

    else if (reagentId === "H2O2_3pct") {

        this.aq.delete("Mn2+");
        this.addPpt({ id: "MnO2", formula: "MnO₂·xH₂O(s)", label: "MnO₂·xH₂O(s) ตะกอนดำ", color: "#1c1917", border: "#44403c", style: "dense" });
        observations.push("3% H₂O₂ ออกซิไดส์แมงกานีสในเบส ได้ตะกอนสีดำของ MnO₂·2H₂O(s)!");
        equations.push("Mn(OH)₂(s) + H₂O₂(aq) → MnO₂·2H₂O(s)↓ (ตะกอนสีดำ)");
      }
      if (this.aq.has("[Cr(OH)4]-") || (this.aq.has("Cr3+") && this.pH === "basic")) {
        this.aq.delete("[Cr(OH)4]-");
        this.aq.delete("Cr3+");
        this.aq.add("CrO4_2-");
        observations.push("3% H₂O₂ ออกซิไดส์ [Cr(OH)₄]⁻ (สีเขียว) เป็นสารละลายสีเหลืองสดของ CrO₄²⁻(aq)!");
        equations.push("2[Cr(OH)₄]⁻(aq) + 3H₂O₂(aq) + 2OH⁻(aq) → 2CrO₄²⁻(aq) (สีเหลือง) + 8H₂O(l)");
      }
      if (this.aq.has("Cr2O7_2-") && this.pH === "acidic") {
        this.aq.delete("Cr2O7_2-");
        this.aq.add("CrO5_blue");
        observations.push("เกิดสารละลายสีน้ำเงินเข้มของ CrO(O₂)₂ (chromium pentoxide, CrO₅) ซึ่งจางหายไปอย่างรวดเร็ว! ยืนยันว่ามี Cr³⁺");
        equations.push("Cr₂O₇²⁻(aq) + 2H⁺(aq) + 4H₂O₂(aq) → 2CrO(O₂)₂(aq) (สีน้ำเงิน) + 5H₂O(l)");
      }

      if (observations.length === 0) {
        observations.push("เติม 3% H₂O₂ 1 mL ลงในสารละลาย (เกิดฟองแก๊ส O₂ เล็กน้อย)");
      }
    }

    // ------------------------------------------------------------------------
    // 8. 0.1 M K2CrO4 (Lead confirmation test)
    // ------------------------------------------------------------------------
    else if (reagentId === "K2CrO4") {
      this.hasCrO4Reagent = true;
      if (this.aq.has("Pb2+")) {
        this.aq.delete("Pb2+");
        this.addPpt({ id: "PbCrO4", formula: "PbCrO₄(s)", label: "PbCrO₄(s) ตะกอนเหลือง", color: "#facc15", border: "#eab308", style: "dense" });
        observations.push("เกิดตะกอนสีเหลืองสดของ PbCrO₄(s)! (สามารถยืนยันต่อโดยแยกตะกอนมาละลายใน 6 M NaOH)");
        equations.push("Pb²⁺(aq) + CrO₄²⁻(aq) → PbCrO₄(s)↓ (ตะกอนสีเหลือง)");
      } else {
        observations.push("สารละลายมีสีเหลืองของ K₂CrO₄ แต่ไม่เกิดตะกอนเหลืองของ PbCrO₄");
      }
    }

    // ------------------------------------------------------------------------
    // 9. DMG (Dimethylglyoxime - Nickel confirmation test)
    // ------------------------------------------------------------------------
    else if (reagentId === "DMG") {
      if (this.aq.has("[Ni(NH3)6]2+") || (this.aq.has("Ni2+") && (this.pH === "ammoniacal" || this.pH === "basic"))) {
        this.aq.delete("[Ni(NH3)6]2+");
        this.aq.delete("Ni2+");
        this.addPpt({ id: "Ni(DMG)2", formula: "Ni(C₄H₇O₂N₂)₂(s)", label: "Ni(DMG)₂(s) ตะกอนสีแดง", color: "#e11d48", border: "#9f1239", style: "fluffy" });
        observations.push("เกิดตะกอนสีแดงชมพูสด (ตะกอนแดง) ของ Nickel dimethylglyoxime! ยืนยันว่ามี Ni²⁺");
        equations.push("[Ni(NH₃)₆]²⁺(aq) + 2C₄H₈O₂N₂(aq) + 4H₂O(l) → Ni(C₄H₇O₂N₂)₂(s)↓ (ตะกอนแดง) + 6NH₄⁺(aq) + 4OH⁻(aq)");
      } else if (this.aq.has("Ni2+")) {
        observations.push("มี Ni²⁺ อยู่แต่สารละลายยังไม่เป็นเบสแอมโมเนีย! ต้องเติม 4 M NH₄Cl + 15 M NH₃ จนเป็นเบสก่อนหยด DMG");
      } else {
        observations.push("ไม่เกิดตะกอนสีแดงเมื่อหยด DMG (ไม่มี Ni²⁺ ในหลอดนี้)");
      }
    }

    // ------------------------------------------------------------------------
    // 10. 1 M KSCN (Iron(III) confirmation test #1)
    // ------------------------------------------------------------------------
    else if (reagentId === "KSCN") {
      if (this.aq.has("Fe3+")) {
        this.aq.add("[Fe(SCN)]2+");
        observations.push("สารละลายเปลี่ยนเป็นสีแดงเลือดนกเข้มของ [Fe(SCN)]²⁺(aq)! ยืนยันว่ามี Fe³⁺");
        equations.push("Fe³⁺(aq) + SCN⁻(aq) → [Fe(SCN)]²⁺(aq) (สารละลายสีแดงเลือดนก)");
      } else if (this.hasPpt("Fe(OH)3")) {
        observations.push("Fe(OH)₃ ยังอยู่ในรูปตะกอน! ต้องละลายตะกอนใน 6 M HCl + 6 M HNO₃ ก่อนเติม KSCN");
      } else {
        observations.push("ไม่เกิดสารละลายสีแดงเลือดนก (ไม่มี Fe³⁺ ในสารละลายนี้)");
      }
    }

    // ------------------------------------------------------------------------
    // 11. K4[Fe(CN)6] (Iron(III) test #2 & Zinc test)
    // ------------------------------------------------------------------------
    else if (reagentId === "K4FeCN6") {
      if (this.aq.has("Fe3+")) {
        this.aq.delete("Fe3+");
        this.addPpt({ id: "KFe[Fe(CN)6]", formula: "KFe[Fe(CN)₆](s)", label: "KFe[Fe(CN)₆](s) ตะกอนน้ำเงิน", color: "#1e3a8a", border: "#172554", style: "dense" });
        observations.push("เกิดตะกอนสีน้ำเงินเข้ม (Prussian Blue) ของ KFe[Fe(CN)₆](s)! ยืนยันว่ามี Fe³⁺");
        equations.push("Fe³⁺(aq) + K⁺(aq) + [Fe(CN)₆]⁴⁻(aq) → KFe[Fe(CN)₆](s)↓ (ตะกอนสีน้ำเงิน)");
      } else if (this.aq.has("Zn2+") && (this.pH === "acidic" || this.pH === "weak_acidic" || this.pH === "neutral")) {
        this.aq.delete("Zn2+");
        this.addPpt({ id: "K2Zn3[Fe(CN)6]2", formula: "K₂Zn₃[Fe(CN)₆]₂(s)", label: "K₂Zn₃[Fe(CN)₆]₂ ตะกอนขาวเขียวอ่อน", color: "#d9f99d", border: "#84cc16", style: "dense" });
        observations.push("เกิดตะกอนสีขาวอมเขียวอ่อนของ K₂Zn₃[Fe(CN)₆]₂(s)! (ทดสอบต่อโดยละลายใน 6 M NaOH)");
        equations.push("3Zn²⁺(aq) + 2K⁺(aq) + 2[Fe(CN)₆]⁴⁻(aq) → K₂Zn₃[Fe(CN)₆]₂(s)↓");
      } else if (this.aq.has("[Zn(NH3)4]2+")) {
        observations.push("ต้องหยด 6 M HCl จนสารละลายมีฤทธิ์เป็นกรดก่อนเติม K₄[Fe(CN)₆] เพื่อทดสอบ Zn²⁺");
      } else {
        observations.push("ไม่เกิดตะกอนสีน้ำเงินหรือตะกอนขาวเขียวอ่อนเมื่อหยด K₄[Fe(CN)₆]");
      }
    }

    // ------------------------------------------------------------------------
    // 12. NaBiO3(s) (Manganese(II) confirmation test)
    // ------------------------------------------------------------------------
    else if (reagentId === "NaBiO3") {
      if (this.aq.has("Mn2+") && this.pH === "acidic") {
        this.aq.delete("Mn2+");
        this.aq.add("MnO4-");
        this.addPpt({ id: "NaBiO3_excess", formula: "NaBiO₃(s)", label: "ผง NaBiO₃ ส่วนเกิน", color: "#a8a29e", border: "#78716c", style: "dense" });
        observations.push("เกิดสารละลายสีม่วงแดงของ MnO₄⁻(aq)! ยืนยันว่ามี Mn²⁺");
        equations.push("2Mn²⁺(aq) + 5NaBiO₃(s) + 14H⁺(aq) → 2MnO₄⁻(aq) (สีม่วงแดง) + 5Bi³⁺(aq) + 7H₂O(l) + 5Na⁺(aq)");
      } else if (this.aq.has("Mn2+")) {
        observations.push("ต้องเติม 6 M HNO₃ 2 หยดให้สารละลายเป็นกรดและอุ่นก่อนเติม NaBiO₃!");
      } else if (this.hasPpt("MnO2")) {
        observations.push("MnO₂·xH₂O ยังเป็นตะกอนสีดำ! ต้องละลายตะกอนด้วย 6 M HCl + 6 M HNO₃ ก่อน");
      } else {
        this.addPpt({ id: "NaBiO3_excess", formula: "NaBiO₃(s)", label: "ผง NaBiO₃ ที่ไม่ละลาย", color: "#a8a29e", border: "#78716c", style: "dense" });
        observations.push("ผง NaBiO₃ นอนก้นหลอด สารละลายไม่เปลี่ยนเป็นสีม่วงแดง (ไม่มี Mn²⁺)");
      }
    }

    // ------------------------------------------------------------------------
    // 13. 1 M BaCl2 (Chromium test in Part 4)
    // ------------------------------------------------------------------------
    else if (reagentId === "BaCl2") {
      if (this.aq.has("CrO4_2-")) {
        this.aq.delete("CrO4_2-");
        this.addPpt({ id: "BaCrO4", formula: "BaCrO₄(s)", label: "BaCrO₄(s) ตะกอนเหลือง", color: "#fde047", border: "#ca8a04", style: "dense" });
        observations.push("เกิดตะกอนสีเหลืองของ BaCrO₄(s)!");
        equations.push("CrO₄²⁻(aq) + Ba²⁺(aq) → BaCrO₄(s)↓ (ตะกอนเหลือง)");
      } else {
        observations.push("ไม่เกิดตะกอนเหลืองของ BaCrO₄ (ไม่มี CrO₄²⁻ ในสารละลาย)");
      }
    }

    // ------------------------------------------------------------------------
    // 14. Catechol Violet (Aluminum confirmation test in Part 4)
    // ------------------------------------------------------------------------
    else if (reagentId === "CatecholViolet") {
      if (this.aq.has("Al3+") && (this.pH === "weak_acidic" || this.pH === "neutral")) {
        this.aq.add("Al_CV_complex");
        observations.push("สารละลายเปลี่ยนเป็นสีน้ำเงินสด! ยืนยันว่ามี Al³⁺");
        equations.push("Al³⁺(aq) + Catechol violet(aq) → [Al(Catechol violet)] complex (สารละลายสีน้ำเงิน)");
      } else if (this.hasPpt("Al(OH)3")) {
        observations.push("ต้องละลายตะกอนวุ้นขาว Al(OH)₃ ด้วย 6 M CH₃COOH พอดี และเติมน้ำกลั่น 1 mL ก่อนหยด Catechol violet");
      } else {
        this.aq.add("CatecholViolet_free");
        observations.push("ไม่เปลี่ยนเป็นสีน้ำเงินของสารเชิงซ้อน Al³⁺");
      }
    }

    const obsText = observations.join(" • ");
    const eqText = equations.join(" | ");
    this.lastObservation = obsText;
    if (eqText) this.lastEquation = eqText;
    this.logs.unshift({
      time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      action: `เติม ${window.REAGENT_CATALOG.find(r => r.id === reagentId)?.name || reagentId}`,
      obs: obsText,
      eq: eqText
    });

    return { obs: obsText, eq: eqText };
  }

  // Equipment Action: Heat in Hot Water Bath / Hot Plate
  heatTube() {
    this.temperature = "hot";
    let observations = [];
    let equations = [];

    if (this.hasPpt("PbCl2")) {
      this.removePpt("PbCl2");
      this.aq.add("Pb2+");
      observations.push("ตะกอนขาว PbCl₂(s) ละลายในน้ำร้อนได้เป็นสารละลายใสของ Pb²⁺(aq)!");
      equations.push("PbCl₂(s) ──(น้ำร้อน Δ)──► Pb²⁺(aq) + 2Cl⁻(aq)");
    }
    if (this.hasPpt("AgCl") || this.hasPpt("Hg2Cl2")) {
      observations.push("ตะกอนขาวของ AgCl / Hg₂Cl₂ ไม่ละลายในน้ำร้อน (สามารถเซนตริฟิวจ์ขณะร้อนเพื่อแยกสารละลาย Pb²⁺ ออก)");
    }
    if (this.hasH2O2 && this.pH === "basic") {
      this.bubbles = true;
      observations.push("อุ่นบน Hot plate / อ่างน้ำร้อน: สลาย H₂O₂ ส่วนเกินและทำให้ปฏิกิริยาออกซิเดชันสมบูรณ์");
    }

    if (observations.length === 0) {
      observations.push("อุ่นหลอดทดลองในอ่างน้ำร้อน (อุณหภูมิสูงช่วยให้ตะกอนละลายหรือปฏิกิริยาเกิดสมบูรณ์ขึ้น)");
    }

    const obsText = observations.join(" • ");
    const eqText = equations.join(" | ");
    this.lastObservation = obsText;
    if (eqText) this.lastEquation = eqText;
    this.logs.unshift({
      time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      action: "🔥 อุ่นในอ่างน้ำร้อน / Hot Plate",
      obs: obsText,
      eq: eqText
    });
    return { obs: obsText, eq: eqText };
  }

  // Equipment Action: Add Distilled Water + Heat (for Part 2 Hot Water extraction or Part 4 dilution)
  addHotWater() {
    this.volume = Math.min(4.0, +(this.volume + 1.0).toFixed(1));
    this.temperature = "hot";
    let obs = "เติมน้ำกลั่น 1 mL และนำไปอุ่นบนอ่างน้ำร้อนพร้อมคนด้วยแท่งแก้ว";
    let eq = "";
    const hadPbCl2 = this.hasPpt("PbCl2");
    const hasOtherGroup1 = this.hasPpt("AgCl") || this.hasPpt("Hg2Cl2");

    if (hadPbCl2 && hasOtherGroup1) {
      this.removePpt("PbCl2");
      this.aq.add("Pb2+");
      this.centrifuged = false;
      obs = "เติมน้ำกลั่น 1 mL และอุ่นในอ่างน้ำร้อน: ตะกอนขาวละลายบางส่วน! (PbCl₂ ละลายออกมาเป็น Pb²⁺ ในสารละลายใส แต่ยังมีตะกอนขาวของ AgCl เหลืออยู่) → ให้กด 'เซนตริฟิวจ์' แล้วกด 'แยกตะกอน/สารละลาย' เพื่อนำน้ำใสไปตรวจ Pb²⁺ และเก็บตะกอนขาวไว้ตรวจ Ag⁺";
      eq = "PbCl₂(s) ──(น้ำร้อน Δ)──► Pb²⁺(aq) + 2Cl⁻(aq) ; AgCl(s) ไม่ละลายในน้ำร้อน";
    } else if (hadPbCl2) {
      this.removePpt("PbCl2");
      this.aq.add("Pb2+");
      obs = "เติมน้ำกลั่น 1 mL และอุ่นในอ่างน้ำร้อน: ตะกอนขาว PbCl₂ ละลายหมด ได้สารละลายใสไม่มีสี! (ไม่มีตะกอน AgCl เหลือ) → หยด 0.1 M K₂CrO₄ เพื่อยืนยัน Pb²⁺ ได้เลย";
      eq = "PbCl₂(s) ──(น้ำร้อน Δ)──► Pb²⁺(aq) + 2Cl⁻(aq)";
    } else if (hasOtherGroup1) {
      obs = "เติมน้ำกลั่น 1 mL และอุ่นในอ่างน้ำร้อน: ตะกอนสีขาวไม่ละลายในน้ำร้อน (ไม่มี Pb²⁺) → นำตะกอนขาวไปหยด 6 M NH₃ เพื่อทดสอบ Ag⁺ ต่อได้เลย";
    }
    this.lastObservation = obs;
    if (eq) this.lastEquation = eq;
    this.logs.unshift({
      time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      action: "💧🔥 เติมน้ำกลั่น 1 mL + อุ่นในอ่างน้ำร้อน",
      obs,
      eq
    });
    return { obs, eq };
  }

  // Equipment Action: Centrifuge
  centrifuge() {
    if (this.ppts.length === 0) {
      const obs = "ไม่มีตะกอนแขวนลอยในหลอดนี้ สารละลายยังคงใสเหมือนเดิม";
      this.lastObservation = obs;
      return { obs, eq: "" };
    }
    this.centrifuged = true;
    const pptNames = this.ppts.map(p => p.formula).join(", ");
    const obs = `เซนตริฟิวจ์เสร็จสิ้น: ตะกอน (${pptNames}) อัดแน่นอยู่ที่ก้นหลอด พร้อมแยกสารละลายใส (Decant) หรือล้างตะกอน`;
    this.lastObservation = obs;
    this.logs.unshift({
      time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      action: "🌀 นำไปเซนตริฟิวจ์ (Centrifuge)",
      obs,
      eq: ""
    });
    return { obs, eq: "" };
  }

  // Equipment Action: Wash Precipitate with Distilled Water & Centrifuge
  washPrecipitate() {
    if (this.ppts.length === 0) {
      return { obs: "ไม่มีตะกอนให้ล้างในหลอดนี้", eq: "" };
    }
    // Washing removes supernatant aqueous ions and leaves only clean precipitate
    this.aq.clear();
    this.hasCrO4Reagent = false;
    this.hasH2O2 = false;
    this.pH = "neutral";
    this.acidType = "none";
    this.washed = true;
    this.centrifuged = true;
    this.volume = 0.6;
    const pptNames = this.ppts.map(p => p.formula).join(", ");
    const obs = `ล้างตะกอน (${pptNames}) ด้วยน้ำกลั่น เซนตริฟิวจ์และเทน้ำล้างทิ้ง เหลือเฉพาะตะกอนสะอาดในหลอด`;
    this.lastObservation = obs;
    this.logs.unshift({
      time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      action: "🚿 ล้างตะกอนด้วยน้ำกลั่น + เซนตริฟิวจ์",
      obs,
      eq: ""
    });
    return { obs, eq: "" };
  }
}

window.VirtualTube = VirtualTube;

// ============================================================================
// SMART LAB ADVISOR: RECOMMENDED NEXT STEPS BASED ON TUBE STATE
// ============================================================================
window.getSmartRecommendations = function(tube) {
  const recs = [];

  // Check if uncentrifuged precipitate exists
  if (tube.ppts.length > 0 && !tube.centrifuged) {
    recs.push({
      title: "🌀 เซนตริฟิวจ์ (Centrifuge)",
      detail: "มีตะกอนแขวนลอยอยู่ในหลอด ควรนำไปเซนตริฟิวจ์เพื่อให้ตะกอนตกนอนก้นหลอดก่อนแยกสารละลาย",
      actionType: "equip",
      actionId: "centrifuge",
      priority: "high"
    });
  }

  // Check if centrifuged and has both precipitate and supernatant
  if (tube.ppts.length > 0 && tube.centrifuged && tube.aq.size > 0) {
    recs.push({
      title: "🧪 แยกตะกอนและสารละลายใส (Decant)",
      detail: "แยกสารละลายใสเหนือตะกอนออกเป็นอีกหลอด เพื่อนำไปวิเคราะห์ตอนถัดไป",
      actionType: "equip",
      actionId: "decant",
      priority: "high"
    });
  }

  // Group 1 initial check
  const hasInitialIons = ["Ag+", "Pb2+", "Hg2_2+", "Ni2+", "Fe3+", "Mn2+", "Cr3+", "Al3+", "Zn2+"].some(i => tube.aq.has(i));
  if (hasInitialIons && !tube.hasCl && tube.ppts.length === 0 && tube.pH === "neutral") {
    recs.push({
      title: "ตอนที่ 1: หยด 6 M HCl (แยกแคทไอออนกลุ่มที่ 1)",
      detail: "หยด 6 M HCl 1–2 หยด เพื่อตรวจสอบว่ามีตะกอนขาวของ AgCl, PbCl₂ หรือ Hg₂Cl₂ หรือไม่",
      actionType: "reagent",
      actionId: "HCl_6M",
      priority: "normal"
    });
  }

  // If HCl added and no Group 1 ppt, move to Group 2/3 precipitation with NaOH + H2O2

      detail: "แยกแคทไอออนกลุ่มที่ 2 (ตะกอนไฮดรอกไซด์ Ni²⁺, Fe³⁺, Mn²⁺) ออกจากกลุ่มที่ 3 (สารละลาย)",
      actionType: "reagent",
      actionId: "NaOH_6M",
      priority: "normal"
    });
  }

  if (tube.pH === "basic" && !tube.hasH2O2 && (tube.hasPpt("Mn(OH)2") || tube.aq.has("[Cr(OH)4]-") || tube.hasPpt("Ni(OH)2") || tube.hasPpt("Fe(OH)3"))) {

      title: "ตอนที่ 1: เติม 3% H₂O₂ 1 mL แล้วอุ่น",
      detail: "ออกซิไดส์ Mn(OH)₂ เป็นตะกอนดำ MnO₂·xH₂O และออกซิไดส์ [Cr(OH)₄]⁻ เป็น CrO₄²⁻ สีเหลือง",
      actionType: "reagent",
      actionId: "H2O2_3pct",
      priority: "normal"
    });
  }

  // Part 2: Group 1 white precipitates
  if ((tube.hasPpt("AgCl") || tube.hasPpt("PbCl2") || tube.hasPpt("Hg2Cl2")) && tube.temperature !== "hot") {
    recs.push({
      title: "ตอนที่ 2: เติมน้ำกลั่น 1 mL + อุ่นในอ่างน้ำร้อน",
      detail: "ทดสอบการละลายของตะกอนขาวในน้ำร้อนเพื่อแยก PbCl₂ (ละลายในน้ำร้อน) ออกจาก AgCl, Hg₂Cl₂",
      actionType: "equip",
      actionId: "hot_water",
      priority: "normal"
    });
  }

  if (tube.aq.has("Pb2+") && !tube.hasCrO4Reagent && tube.ppts.length === 0) {
    recs.push({
      title: "ตอนที่ 2 (ทดสอบ Pb²⁺): หยด 0.1 M K₂CrO₄ 2–3 หยด",

      actionType: "reagent",
      actionId: "K2CrO4",
      priority: "normal"
    });
  }

  if (tube.hasPpt("PbCrO4")) {
    recs.push({
      title: "ตอนที่ 2 (ยืนยัน Pb²⁺): ละลายตะกอนเหลืองใน 6 M NaOH",
      detail: "ตะกอนเหลือง PbCrO₄ จะละลายใน 6 M NaOH ได้สารละลายสีเหลืองของ [Pb(OH)₄]²⁻ และ CrO₄²⁻",
      actionType: "reagent",
      actionId: "NaOH_6M",
      priority: "normal"
    });
  }

  if ((tube.hasPpt("AgCl") || tube.hasPpt("Hg2Cl2")) && tube.aq.size === 0) {
    recs.push({
      title: "ตอนที่ 2 (ทดสอบ Ag⁺ / Hg₂²⁺): หยด 6 M NH₃ 1 mL",
      detail: "AgCl จะละลายเป็น [Ag(NH₃)₂]⁺ ใสไม่มีสี ส่วน Hg₂Cl₂ จะเปลี่ยนเป็นตะกอนเทาดำ",
      actionType: "reagent",
      actionId: "NH3_6M",
      priority: "normal"

      actionType: "reagent",
      actionId: "HNO3_6M",
      priority: "normal"
    });
  }

  // Part 3: Group 2 precipitates (Ni(OH)2, Fe(OH)3, MnO2)

      actionType: "reagent",
      actionId: "HCl_6M",
      priority: "normal"
    });
  }

      recs.push({
        title: "ตอนที่ 3: เติม 4 M NH₄Cl + 15 M NH₃ จนเป็นเบส",

        actionId: "NH4Cl_NH3_15M",
        priority: "normal"

      recs.push({
        title: "ตอนที่ 3 (ทดสอบ Fe³⁺ หลอด 2): หยด 0.1 M K₄[Fe(CN)₆] 2–3 หยด",

        actionType: "reagent",
        actionId: "NaBiO3",
        priority: "normal"
      });
    }
  }

  if (tube.aq.has("[Ni(NH3)6]2+")) {
    recs.push({
      title: "ตอนที่ 3 (ยืนยัน Ni²⁺): หยด DMG 2–3 หยด",

      actionType: "reagent",
      actionId: "DMG",
      priority: "normal"

  // Part 4 recommendations
  if (tube.aq.has("[Al(OH)4]-") || tube.aq.has("[Zn(OH)4]2-")) {
    recs.push({
      title: "ตอนที่ 4: หยด 6 M CH₃COOH จนเป็นกรด",

      actionId: "CH3COOH_6M",
      priority: "normal"

      title: "ตอนที่ 4: หยด 6 M NH₃ จนเป็นเบส + 0.5 mL",

      actionId: "NH3_6M",

  if (tube.aq.has("Al3+") && tube.pH === "weak_acidic" && tube.washed) {
    recs.push({
      title: "ตอนที่ 4 (ยืนยัน Al³⁺): หยด Catechol violet 2 หยด",
      detail: "สารละลายจะเปลี่ยนเป็นสีน้ำเงินของสารเชิงซ้อน Al³⁺",

      actionId: "CatecholViolet",

      title: "ตอนที่ 4 (ทดสอบ CrO₄²⁻): เติม 1 M BaCl₂ 0.5 mL",
      detail: "เกิดตะกอนสีเหลืองของ BaCrO₄(s)",
      actionType: "reagent",
      actionId: "BaCl2",
      priority: "normal"

      detail: "เปลี่ยน BaCrO₄ เป็นสารละลายสีส้มของ Cr₂O₇²⁻",
      actionType: "reagent",
      actionId: "HNO3_6M",
      priority: "normal"
    });
  }

  if (tube.aq.has("Cr2O7_2-")) {
    recs.push({
      title: "ตอนที่ 4 (ยืนยัน Cr³⁺ ขั้น 2): หยด 3% H₂O₂ 2–3 หยด",
      detail: "เกิดสารละลายสีน้ำเงินเข้มของ CrO₅ (CrO(O₂)₂) ที่จางหายอย่างรวดเร็ว",
      actionType: "reagent",
      actionId: "H2O2_3pct",
      priority: "normal"
    });
  }

  return recs;
};

function renderTestTubeSVG(config = {}) {
  const {
    liquidColor = "rgba(226, 232, 240, 0.18)",
    ppts = [],
    centrifuged = true,
    bubbles = false,
    hot = false,
    volume = 1.2,
    size = "normal", // 'small' | 'normal' | 'large'
    dropColor = null,
    spinning = false
  } = config;

  const dims = size === "small"
    ? { w: 74, h: 175 }
    : size === "large"
      ? { w: 120, h: 265 }
      : { w: 96, h: 220 };

  // Compute liquid level in SVG coordinates (viewBox 0 0 100 230)
  // Tube bottom is at y=205, top is at y=25
  const clampedVol = Math.min(3.5, Math.max(0.4, volume));
  const fillHeight = 45 + (clampedVol / 3.5) * 95; // between 55 and 140
  const liquidTopY = 205 - fillHeight;

  const uid = "tt-" + Math.random().toString(36).slice(2, 8);
  const primaryPpt = ppts && ppts.length > 0 ? ppts[ppts.length - 1] : null;
  const secondaryPpt = ppts && ppts.length > 1 ? ppts[0] : null;

  let pptMarkup = "";
  if (primaryPpt) {
    if (centrifuged) {
      // Compact settled pellet at the bottom of the test tube (supports dual-layer if 2 precipitates!)
      pptMarkup = `
        ${secondaryPpt ? `
          <path d="M 27 174 Q 50 178 73 174 L 73 185 A 23 20 0 0 1 27 185 Z"
                fill="${secondaryPpt.color}" stroke="${secondaryPpt.border || secondaryPpt.color}" stroke-width="0.8" opacity="0.92"/>
        ` : ""}
        <path d="M 27 182 Q 50 186 73 182 L 73 185 A 23 20 0 0 1 27 185 Z"
              fill="${primaryPpt.color}" stroke="${primaryPpt.border || primaryPpt.color}" stroke-width="1" opacity="0.96"/>
        <ellipse cx="50" cy="${secondaryPpt ? 174 : 182}" rx="22.5" ry="4" fill="${secondaryPpt ? secondaryPpt.color : primaryPpt.color}" opacity="0.98"/>
      `;
    } else {
      // Suspended cloudy precipitate + settling bottom layer
      pptMarkup = `
        <rect x="27" y="${liquidTopY + 4}" width="46" height="${200 - liquidTopY}" rx="20"
              fill="${primaryPpt.color}" opacity="0.52" />
        <path d="M 27 176 Q 50 181 73 176 L 73 185 A 23 20 0 0 1 27 185 Z"
              fill="${primaryPpt.color}" opacity="0.92"/>
        <circle cx="38" cy="${liquidTopY + 25}" r="3.5" fill="${secondaryPpt ? secondaryPpt.color : primaryPpt.color}" opacity="0.75"/>
        <circle cx="58" cy="${liquidTopY + 38}" r="4.2" fill="${primaryPpt.color}" opacity="0.7"/>
        <circle cx="45" cy="${liquidTopY + 52}" r="3.8" fill="${secondaryPpt ? secondaryPpt.color : primaryPpt.color}" opacity="0.8"/>
        <circle cx="61" cy="${liquidTopY + 18}" r="2.8" fill="${primaryPpt.color}" opacity="0.65"/>
      `;
    }
  }

  let bubbleMarkup = "";
  if (bubbles) {
    bubbleMarkup = `
      <g class="gas-bubble">
        <circle cx="40" cy="175" r="2.5" fill="rgba(255,255,255,0.75)" />
        <circle cx="55" cy="162" r="3.2" fill="rgba(255,255,255,0.65)" />
        <circle cx="47" cy="148" r="2.0" fill="rgba(255,255,255,0.75)" />
        <circle cx="60" cy="180" r="2.2" fill="rgba(255,255,255,0.70)" />
      </g>
    `;
  }

  let dropMarkup = "";
  if (dropColor) {
    dropMarkup = `
      <g class="reagent-drop">
        <path d="M 50 18 C 46 25, 44 29, 50 33 C 56 29, 54 25, 50 18 Z" fill="${dropColor}" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"/>
      </g>
    `;
  }

  const extraClass = `${spinning ? "spinning-tube" : ""} ${hot ? "heating-tube" : ""}`.trim();

  return `
    <svg width="${dims.w}" height="${dims.h}" viewBox="0 0 100 230" class="mx-auto select-none ${extraClass}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="${uid}-clip">
          <path d="M 26 25 L 74 25 L 74 182 A 24 23 0 0 1 26 182 Z" />
        </clipPath>
        <linearGradient id="${uid}-glass" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(255,255,255,0.32)" />
          <stop offset="22%" stop-color="rgba(255,255,255,0.08)" />
          <stop offset="78%" stop-color="rgba(255,255,255,0.03)" />
          <stop offset="100%" stop-color="rgba(255,255,255,0.26)" />
        </linearGradient>
      </defs>

      ${dropMarkup}

      <!-- Tube Inner Contents Clipped -->
      <g clip-path="url(#${uid}-clip)">
        <!-- Back glass tint -->
        <rect x="24" y="20" width="52" height="190" fill="rgba(15, 23, 42, 0.35)" />

        <!-- Liquid Column -->
        <rect x="25" y="${liquidTopY}" width="50" height="${210 - liquidTopY}" fill="${liquidColor}" />

        <!-- Meniscus Curve -->
        <ellipse cx="50" cy="${liquidTopY}" rx="24" ry="4.2" fill="${liquidColor}" stroke="rgba(255,255,255,0.38)" stroke-width="0.9" />

        <!-- Precipitate Layer -->
        ${pptMarkup}

        <!-- Rising Gas Bubbles -->
        ${bubbleMarkup}
      </g>

      <!-- Graduation Marks -->
      <line x1="62" y1="165" x2="70" y2="165" stroke="rgba(255,255,255,0.28)" stroke-width="1" />
      <line x1="65" y1="145" x2="70" y2="145" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
      <line x1="62" y1="125" x2="70" y2="125" stroke="rgba(255,255,255,0.28)" stroke-width="1" />
      <line x1="65" y1="105" x2="70" y2="105" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
      <line x1="62" y1="85"  x2="70" y2="85"  stroke="rgba(255,255,255,0.28)" stroke-width="1" />

      <!-- Glass specular reflection overlay -->
      <path d="M 26 25 L 74 25 L 74 182 A 24 23 0 0 1 26 182 Z"
            fill="url(#${uid}-glass)"

            stroke-width="2" />

      <!-- Left vertical shine highlight -->
      <path d="M 32 32 L 32 176" stroke="rgba(255,255,255,0.42)" stroke-width="2.5" stroke-linecap="round" />

      <!-- Flared Glass Rim at Top -->
      <rect x="21" y="20" width="58" height="6" rx="3"
            fill="rgba(226, 232, 240, 0.25)"
            stroke="rgba(226, 232, 240, 0.78)"
            stroke-width="1.6" />
    </svg>
  `;
}

// ============================================================================
function pickTwoCations(pool, category = "any") {
  const g1 = pool.filter(id => window.CATION_DB[id].group === 1);
  const g2 = pool.filter(id => window.CATION_DB[id].group === 2);

  if (category === "both_g1" && g1.length >= 2) {
    const shuffled = [...g1].sort(() => Math.random() - 0.5);
    return [shuffled[0], shuffled[1]];
  }
  if (category === "g1_g2" && g1.length >= 1 && g2.length >= 1) {
    const p1 = g1[Math.floor(Math.random() * g1.length)];
    const p2 = g2[Math.floor(Math.random() * g2.length)];
    return [p1, p2];
  }
  if (category === "both_g2" && g2.length >= 2) {
    const shuffled = [...g2].sort(() => Math.random() - 0.5);
    return [shuffled[0], shuffled[1]];
  }
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return [shuffled[0], shuffled[1]];
}

  AppState.eliminatedIons = new Set();
  AppState.unknownFeedback = null;

  let initialIons = [];
  let tubeTitle = "หลอดที่ 1 (สารตัวอย่าง)";
  let tubeSub = "ปริมาตร 1.0 mL";

  if (mode === "exam_2mix") {
    const examPool = ["Ag+", "Pb2+", "Ni2+", "Fe3+", "Mn2+"];
    initialIons = pickTwoCations(examPool, AppState.pairCategory);
    AppState.secretUnknownIons = [...initialIons];
    AppState.unknownCode = "EXAM-2X-" + Math.floor(100 + Math.random() * 900);

    tubeSub = "Unknown สารผสม 2 ชนิด (จาก 5 ไอออนสอบ)";
  } else if (mode === "full_2mix") {

    tubeSub = "Unknown สารผสม 2 ชนิด (จาก 9 ไอออนคู่มือ)";
  } else if (mode === "exam_unknown") {
    const examPool = ["Ag+", "Pb2+", "Ni2+", "Fe3+", "Mn2+"];
    const picked = examPool[Math.floor(Math.random() * examPool.length)];
    initialIons = [picked];
    AppState.secretUnknownIons = [picked];
    AppState.unknownCode = "EXAM-1X-" + Math.floor(100 + Math.random() * 900);
    tubeTitle = `สารตัวอย่าง ${AppState.unknownCode}`;
    tubeSub = "Unknown 1 ใน 5 ไอออนสอบแล็บ";
  } else if (mode === "full_unknown") {
    const allPool = Object.keys(window.CATION_DB);
    const picked = allPool[Math.floor(Math.random() * allPool.length)];
    initialIons = [picked];
    AppState.secretUnknownIons = [picked];

    tubeTitle = `สารตัวอย่าง ${AppState.unknownCode}`;
    tubeSub = "Unknown 1 ใน 9 ไอออนตามคู่มือ";
  } else if (mode === "known_single") {
    initialIons = [AppState.selectedKnownIon];
    AppState.secretUnknownIons = [AppState.selectedKnownIon];
    const info = window.CATION_DB[AppState.selectedKnownIon];

    tubeSub = info.thaiName;
  } else if (mode === "custom_mix") {

    }

    tubeSub = initialIons.map(i => window.CATION_DB[i].symbol).join(", ");

function handleAddReagent(reagentId) {
  const tube = AppState.tubes[AppState.selectedTubeIndex];
  if (!tube) return;

  const reagent = window.REAGENT_CATALOG.find(r => r.id === reagentId);
  AppState.animatingDrop = { color: reagent ? reagent.dropColor : "#e2e8f0" };
  renderApp();

  setTimeout(() => {
    tube.applyReagent(reagentId);
    AppState.animatingDrop = null;
    renderApp();
  }, 420);
}

function handleEquipment(action) {
  const tube = AppState.tubes[AppState.selectedTubeIndex];
  if (!tube) return;

  if (action === "centrifuge") {
    AppState.animatingSpin = true;
    renderApp();
    setTimeout(() => {
      tube.centrifuge();
      AppState.animatingSpin = false;
      renderApp();
    }, 550);
  } else if (action === "heat") {
    AppState.animatingHeat = true;
    tube.heatTube();
    renderApp();
    setTimeout(() => {
      AppState.animatingHeat = false;
      renderApp();
    }, 900);
  } else if (action === "hot_water") {
    AppState.animatingHeat = true;
    tube.addHotWater();
    renderApp();
    setTimeout(() => {
      AppState.animatingHeat = false;
      renderApp();
    }, 900);
  } else if (action === "wash") {
    tube.washPrecipitate();
    renderApp();
  } else if (action === "decant") {
    if (tube.ppts.length === 0) {
      alert("หลอดนี้ไม่มีตะกอนให้แยก! หากต้องการแบ่งสารละลายออกเป็นหลายหลอด ให้กดปุ่ม 'แบ่งสารละลาย'");
      return;
    }
    if (!tube.centrifuged) {
      tube.centrifuge();
    }
    // Create a new tube containing ONLY the aqueous supernatant
    const supernatantTube = new window.VirtualTube({
      name: `หลอดที่ ${AppState.tubes.length + 1} (สารละลายใส)`,
      subtitle: `รินแยกจาก ${tube.name}`,
      aq: Array.from(tube.aq),
      ppts: [],
      pH: tube.pH,
      acidType: tube.acidType,
      hasCl: tube.hasCl,
      hasH2O2: tube.hasH2O2,
      hasCrO4Reagent: tube.hasCrO4Reagent,
      temperature: tube.temperature,
      centrifuged: false,
      volume: Math.max(0.8, +(tube.volume * 0.7).toFixed(1)),
      lastObservation: `สารละลายใสเหนือตะกอนที่รินแยกมาจาก ${tube.name}`
    });
    supernatantTube.logs.unshift({
      time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      action: "🫗 รินแยกสารละลายใส (Decant)",
      obs: `ได้สารละลายใสแยกออกจากตะกอนใน ${tube.name}`,
      eq: ""
    });

    // Keep ONLY the precipitate in the current tube
    tube.aq.clear();
    tube.hasCrO4Reagent = false;
    tube.subtitle = `ตะกอนจาก ${tube.name}`;
    tube.volume = 0.5;
    tube.lastObservation = `เหลือเฉพาะตะกอน (${tube.ppts.map(p => p.formula).join(", ")}) ในหลอดนี้ ส่วนสารละลายใสถูกแยกไปที่ ${supernatantTube.name}`;
    tube.logs.unshift({
      time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      action: "🫗 แยกสารละลายใสออก เหลือเฉพาะตะกอน",
      obs: tube.lastObservation,
      eq: ""
    });

    AppState.tubes.push(supernatantTube);
    renderApp();
  } else if (action === "split") {
    const newTube = tube.clone(
      `หลอดที่ ${AppState.tubes.length + 1} (แบ่งส่วน)`,
      `แบ่งมาจาก ${tube.name}`
    );
    newTube.logs.unshift({
      time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
      action: "➗ แบ่งสารละลายออกเป็นหลอดย่อย",
      obs: `แบ่งสารละลายมาจาก ${tube.name} สำหรับแยกทดสอบเฉพาะ`,
      eq: ""
    });
    AppState.tubes.push(newTube);
    AppState.selectedTubeIndex = AppState.tubes.length - 1;
    renderApp();
  } else if (action === "split3") {
    const t1 = tube.clone(`หลอดย่อยที่ 1 (ตรวจ Fe³⁺ ด้วย KSCN)`, `แบ่งจาก ${tube.name}`);
    const t2 = tube.clone(`หลอดย่อยที่ 2 (ตรวจ Fe³⁺ ด้วย K₄[Fe(CN)₆])`, `แบ่งจาก ${tube.name}`);
    const t3 = tube.clone(`หลอดย่อยที่ 3 (ตรวจ Mn²⁺ ด้วย NaBiO₃)`, `แบ่งจาก ${tube.name}`);
    [t1, t2, t3].forEach((subTube, i) => {
      subTube.logs.unshift({
        time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        action: `➗ แบ่งเป็น 3 หลอดทดลอง (หลอดย่อยที่ ${i + 1})`,
        obs: i === 0 ? "พร้อมหยด 1 M KSCN 4–5 หยด เพื่อทดสอบ Fe³⁺"
           : i === 1 ? "พร้อมหยด 0.1 M K₄[Fe(CN)₆] 2–3 หยด เพื่อทดสอบ Fe³⁺"
           : "พร้อมหยด 6 M HNO₃ 2 หยด (อุ่น) แล้วเติม NaBiO₃ 1 ช้อนเล็ก เพื่อทดสอบ Mn²⁺",
        eq: ""
      });
    });
    AppState.tubes.push(t1, t2, t3);
    AppState.selectedTubeIndex = AppState.tubes.length - 3;
    renderApp();
  }
}

function testSolidSolvent(stepKey, stepLabel, isHot) {
  const sample = window.SOLID_UNKNOWNS[AppState.selectedSolidIdx];
  const res = sample.solubilityNotes[stepKey];
  if (!res) return;

  AppState.solidCurrentState = {
    color: res.color,
    ppt: res.ppt,
    dissolved: res.dissolved,
    hot: isHot,
    label: stepLabel
  };

  if (!AppState.solidTestedSteps.some(s => s.key === stepKey)) {
    AppState.solidTestedSteps.push({
      key: stepKey,
      label: stepLabel,
      dissolved: res.dissolved,
      obs: res.obs
    });
  }
  renderApp();
}

function sendSolidToVirtualLab() {
  const sample = window.SOLID_UNKNOWNS[AppState.selectedSolidIdx];
  AppState.labMode = "exam_unknown";
  AppState.secretUnknownIons = [sample.cation];
  AppState.unknownCode = sample.code;

  const starterTube = new window.VirtualTube({

  });

  AppState.tubes = [starterTube];

  AppState.activeTab = "lab";
  renderApp();
}

function renderQuizTab() {
  const questions = window.WORKSHEET_FLOW_ITEMS;
  let score = 0;
  questions.forEach(q => {
    if (AppState.quizAnswers[q.id] === q.correct) score++;
  });

  return `
    <div class="space-y-6 max-w-4xl mx-auto">
      <div class="bg-slate-900/95 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-lg font-bold text-white">🎓 แบบทดสอบเตรียมสอบปฏิบัติการวิเคราะห์แคทไอออน</h2>
          <p class="text-xs text-slate-400">ทบทวนจุดสำคัญของปฏิกิริยา สีตะกอน และการเลือกตัวทำละลายของแข็ง</p>
        </div>
        <div class="flex items-center gap-3">
          ${AppState.quizSubmitted ? `
            <span class="px-4 py-2 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-bold text-sm">
              คะแนน: ${score} / ${questions.length}
            </span>
          ` : ""}
          <button onclick="AppState.quizAnswers = {}; AppState.quizSubmitted = false; renderApp();"
            class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">
            🔄 ทำใหม่อีกครั้ง
          </button>
        </div>
      </div>

      <div class="space-y-4">
        ${questions.map((q, idx) => {
          const picked = AppState.quizAnswers[q.id];
          return `
            <div class="bg-slate-900/95 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
              <div class="text-xs font-bold text-pink-400 uppercase tracking-wider">${q.part}</div>
              <div class="text-sm sm:text-base font-bold text-white">ข้อที่ ${idx + 1}: ${q.prompt}</div>
              <div class="space-y-2 pt-1">
                ${q.options.map((opt, oIdx) => {
                  const isPicked = picked === oIdx;
                  let btnStyle = "bg-slate-950/80 border-slate-800 text-slate-300 hover:border-slate-600";
                  if (AppState.quizSubmitted) {
                    if (oIdx === q.correct) {
                      btnStyle = "bg-emerald-950/70 border-emerald-500 text-emerald-200 font-semibold";
                    } else if (isPicked && oIdx !== q.correct) {
                      btnStyle = "bg-rose-950/70 border-rose-500 text-rose-200";
                    }
                  } else if (isPicked) {
                    btnStyle = "bg-sky-500/20 border-sky-400 text-white font-semibold";
                  }

                  return `
                    <button onclick="selectQuizOption('${q.id}', ${oIdx})"
                      class="w-full text-left p-3 rounded-xl border text-xs sm:text-sm transition flex items-center justify-between ${btnStyle}">
                      <span>${opt}</span>
                      ${AppState.quizSubmitted && oIdx === q.correct ? `<span>✅</span>` : ""}
                      ${AppState.quizSubmitted && isPicked && oIdx !== q.correct ? `<span>❌</span>` : ""}
                    </button>
                  `;
                }).join("")}
              </div>
              ${AppState.quizSubmitted ? `
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-sky-300">
                  <strong>คำอธิบาย:</strong> ${q.explanation}
                </div>
              ` : ""}
            </div>
          `;
        }).join("")}
      </div>

      <div class="text-center pb-6">
        <button onclick="AppState.quizSubmitted = true; renderApp();"
          class="px-8 py-3 rounded-xl font-bold text-sm bg-gradient-to-r from-pink-600 to-rose-600 text-white shadow-lg shadow-pink-600/30 hover:opacity-95 transition">
          ✅ ตรวจคำตอบทั้งหมด
        </button>
      </div>
    </div>
  `;
}

function toggleCustomMixIon(ionId) {
  if (AppState.customMixIons.has(ionId)) {
    if (AppState.customMixIons.size > 1) AppState.customMixIons.delete(ionId);
  } else {
    AppState.customMixIons.add(ionId);
  }
  initLabSample("custom_mix");
}

function setPresetMix(type) {
  if (type === "exam5") {
    AppState.customMixIons = new Set(["Ag+", "Pb2+", "Ni2+", "Fe3+", "Mn2+"]);
  } else {
    AppState.customMixIons = new Set(Object.keys(window.CATION_DB));
  }
  initLabSample("custom_mix");
}

function toggleGuess2Ion(ionId) {
  if (AppState.unknownGuesses2.has(ionId)) {
    AppState.unknownGuesses2.delete(ionId);
  } else {
    if (AppState.unknownGuesses2.size >= 2) {
      // Remove the oldest picked ion so user can smoothly pick 2
      const first = AppState.unknownGuesses2.values().next().value;
      AppState.unknownGuesses2.delete(first);
    }
    AppState.unknownGuesses2.add(ionId);
    AppState.eliminatedIons.delete(ionId);
  }
  renderApp();
}

function toggleEliminateIon(ionId) {
  if (AppState.eliminatedIons.has(ionId)) {
    AppState.eliminatedIons.delete(ionId);
  } else {
    AppState.eliminatedIons.add(ionId);
    AppState.unknownGuesses2.delete(ionId);
  }
  renderApp();
}

function getPairSeparationGuide(ionIds) {
  const infos = ionIds.map(id => window.CATION_DB[id]);
  const [a, b] = infos;
  if (!a || !b) return "";

  const groups = new Set([a.group, b.group]);
  let strategy = "";
  if (a.group === 1 && b.group === 1) {
    strategy = `<strong>ทั้ง ${a.symbol} และ ${b.symbol} อยู่กลุ่มที่ 1 (ตกตะกอนขาวกับ 6 M HCl ทั้งคู่):</strong>
      <br>1. หยด <strong>6 M HCl</strong> → ได้ตะกอนขาวผสม เซนตริฟิวจ์และแยกน้ำใสทิ้ง
      <br>2. กด <strong>เติมน้ำกลั่น 1 mL + อุ่นน้ำร้อน</strong> → PbCl₂ จะละลายออกมาในน้ำร้อน ส่วน AgCl/Hg₂Cl₂ ยังเป็นตะกอนขาว → กดเซนตริฟิวจ์แล้ว <strong>แยกตะกอน/สารละลาย</strong> เป็น 2 หลอด
      <br>3. <strong>หลอดสารละลายใส (น้ำร้อน):</strong> หยด 0.1 M K₂CrO₄ ได้ตะกอนเหลือง PbCrO₄ (ละลายใน 6 M NaOH) ยืนยัน <strong>Pb²⁺</strong>
      <br>4. <strong>หลอดตะกอนขาวที่เหลือ:</strong> หยด 6 M NH₃ ละลายเป็น [Ag(NH₃)₂]⁺ แล้วหยด 6 M HNO₃ ได้ตะกอนขาว AgCl กลับคืน ยืนยัน <strong>Ag⁺</strong>`;
  } else if (groups.has(1) && groups.has(2)) {
    const g1Ion = a.group === 1 ? a : b;
    const g2Ion = a.group === 2 ? a : b;
    strategy = `<strong>มีไอออนกลุ่มที่ 1 (${g1Ion.symbol}) ผสมกับกลุ่มที่ 2 (${g2Ion.symbol}):</strong>
      <br>1. หยด <strong>6 M HCl</strong> → ${g1Ion.symbol} ตกตะกอนสีขาว ส่วน ${g2Ion.symbol} ยังอยู่ในสารละลายใส → กด <strong>เซนตริฟิวจ์</strong> แล้วกด <strong>แยกตะกอน/สารละลาย (Decant)</strong> เป็น 2 หลอด
      <br>2. <strong>หลอดที่ 1 (ตะกอนขาว → ตอนที่ 2):</strong> ${g1Ion.id === "Pb2+" ? "เติมน้ำกลั่น 1 mL + อุ่นน้ำร้อน (ตะกอนละลายหมด) แล้วหยด 0.1 M K₂CrO₄ ได้ตะกอนเหลือง PbCrO₄ ที่ละลายใน 6 M NaOH" : "ไม่ละลายในน้ำร้อน แต่ละลายใน 6 M NH₃ ได้สารละลายใส เมื่อหยด 6 M HNO₃ ได้ตะกอนขาว AgCl กลับคืน"} → ยืนยัน <strong>${g1Ion.symbol}</strong>
      <br>3. <strong>หลอดที่ 2 (สารละลายใส → ตอนที่ 1 & 3):</strong> หยด 6 M NaOH + 3% H₂O₂ ได้ตะกอนของ ${g2Ion.symbol} → ล้างตะกอนและละลายใน 6 M HCl + 6 M HNO₃ → ${
        g2Ion.id === "Ni2+"
          ? "เติม 4 M NH₄Cl + 15 M NH₃ ได้สารละลายสีน้ำเงิน [Ni(NH₃)₆]²⁺ เมื่อหยด DMG ได้ตะกอนสีแดงสด"
          : g2Ion.id === "Fe3+"
            ? "แบ่งทดสอบด้วย 1 M KSCN (ได้สีแดงเลือดนก) และ 0.1 M K₄[Fe(CN)₆] (ได้ตะกอนสีน้ำเงินเข้ม)"
            : "เติม 6 M HNO₃ อุ่น แล้วใส่ผง NaBiO₃ ได้สารละลายสีม่วงแดงของ MnO₄⁻"
      } → ยืนยัน <strong>${g2Ion.symbol}</strong>`;
  } else if (a.group === 2 && b.group === 2) {
    const hasNi = a.id === "Ni2+" || b.id === "Ni2+";
    if (hasNi) {
      const other = a.id === "Ni2+" ? b : a;
      strategy = `<strong>ทั้ง Ni²⁺ และ ${other.symbol} อยู่กลุ่มที่ 2 (ไม่ตกตะกอนกับ 6 M HCl):</strong>
        <br>1. หยด <strong>6 M NaOH + 3% H₂O₂</strong> → ตกตะกอนไฮดรอกไซด์/ออกไซด์ทั้งคู่ → ล้างตะกอน แล้วละลายด้วย <strong>6 M HNO₃ + 6 M HCl</strong>
        <br>2. เติม <strong>4 M NH₄Cl + 15 M NH₃</strong> → <strong>Ni²⁺</strong> จะละลายเป็นสารละลายสีน้ำเงิน [Ni(NH₃)₆]²⁺ ส่วน <strong>${other.symbol}</strong> จะตกตะกอน! → กด <strong>เซนตริฟิวจ์</strong> แล้วกด <strong>แยกตะกอน/สารละลาย</strong>
        <br>3. <strong>หลอดสารละลายสีน้ำเงิน:</strong> หยด DMG ได้ตะกอนสีแดงสด ยืนยัน <strong>Ni²⁺</strong>
        <br>4. <strong>หลอดตะกอนที่เหลือ:</strong> ล้างตะกอน ละลายใน 6 M HCl + 6 M HNO₃ แล้วทดสอบ ${other.id === "Fe3+" ? "ด้วย KSCN (สีแดงเลือดนก) และ K₄[Fe(CN)₆] (ตะกอนน้ำเงิน)" : "ด้วย 6 M HNO₃ + ผง NaBiO₃ (สารละลายสีม่วงแดง MnO₄⁻)"} ยืนยัน <strong>${other.symbol}</strong>`;
    } else {
      strategy = `<strong>ทั้ง Fe³⁺ และ Mn²⁺ อยู่กลุ่มที่ 2 และตกตะกอนร่วมกันตลอด:</strong>
        <br>1. หยด <strong>6 M NaOH + 3% H₂O₂</strong> → ได้ตะกอนผสม Fe(OH)₃ + MnO₂·xH₂O
        <br>2. ล้างตะกอน แล้วละลายด้วย <strong>6 M HCl + 6 M HNO₃</strong> (เมื่อเติม NH₄Cl + NH₃ จะไม่เกิดสีน้ำเงินของ Ni²⁺ แต่ตกตะกอนทั้งคู่เหมือนเดิม)
        <br>3. เมื่อละลายตะกอนใน <strong>6 M HCl + 6 M HNO₃</strong> จนใสแล้ว ให้กดปุ่ม <strong>"🧪🧪🧪 แบ่งเป็น 3 หลอดย่อยทันที"</strong>:
        <br>&nbsp;&nbsp;• <strong>หลอดย่อย 1:</strong> หยด 1 M KSCN → ได้สารละลายสีแดงเลือดนก ยืนยัน <strong>Fe³⁺</strong>
        <br>&nbsp;&nbsp;• <strong>หลอดย่อย 2:</strong> หยด 0.1 M K₄[Fe(CN)₆] → ได้ตะกอนสีน้ำเงินเข้ม ยืนยัน <strong>Fe³⁺</strong>
        <br>&nbsp;&nbsp;• <strong>หลอดย่อย 3:</strong> หยด 6 M HNO₃ + เติมผง NaBiO₃ → ได้สารละลายสีม่วงแดงของ MnO₄⁻ ยืนยัน <strong>Mn²⁺</strong>`;
    }
  } else {
    strategy = `<strong>สรุปสมบัติของทั้ง 2 ไอออน:</strong><br>• <strong>${a.symbol}:</strong> ${a.summary}<br>• <strong>${b.symbol}:</strong> ${b.summary}`;
  }
  return strategy;
}

function revealUnknownSolution() {
  AppState.unknownRevealed = true;
  const secret = AppState.secretUnknownIons;
  if (secret.length === 2) {
    const [i1, i2] = secret.map(id => window.CATION_DB[id]);
    AppState.unknownFeedback = {
      correct: true,
      message: `<div class="space-y-2">
        <div class="font-bold text-base text-amber-300">👁️ เฉลยสารตัวอย่าง ${AppState.unknownCode}: มี ${i1.symbol} (${i1.thaiName}) ผสมกับ ${i2.symbol} (${i2.thaiName})</div>
        <div class="text-slate-200">${getPairSeparationGuide(secret)}</div>
      </div>`
    };
  } else {
    const i1 = window.CATION_DB[secret[0]];
    AppState.unknownFeedback = {
      correct: true,
      message: `👁️ เฉลยสารตัวอย่าง ${AppState.unknownCode}: คือ ${i1.symbol} (${i1.thaiName}) — ${i1.summary}`
    };
  }
  renderApp();
}

function checkUnknownAnswer() {
  const isTwoMix = AppState.labMode === "exam_2mix" || AppState.labMode === "full_2mix";

  if (isTwoMix) {
    const guesses = Array.from(AppState.unknownGuesses2);
    if (guesses.length < 2) {
      AppState.unknownFeedback = {
        correct: false,
        message: `⚠️ กรุณาคลิกเลือกแคทไอออนให้ครบ 2 ชนิดก่อนกดส่งคำตอบ (ขณะนี้เลือกไว้ ${guesses.length}/2 ชนิด)`
      };
      renderApp();
      return;
    }

    const secretSet = new Set(AppState.secretUnknownIons);
    const matched = guesses.filter(g => secretSet.has(g));
    const guessedSymbols = guesses.map(g => window.CATION_DB[g].symbol).join(" และ ");

    if (matched.length === 2) {
      AppState.unknownRevealed = true;
      const [i1, i2] = AppState.secretUnknownIons.map(id => window.CATION_DB[id]);
      AppState.unknownFeedback = {
        correct: true,
        message: `<div class="space-y-2">
          <div class="font-bold text-base text-emerald-300">🎉 ยอดเยี่ยม! คุณวิเคราะห์ถูกต้องทั้ง 2 ชนิด (2/2): ${i1.symbol} และ ${i2.symbol}</div>
          <div class="text-slate-200">${getPairSeparationGuide(AppState.secretUnknownIons)}</div>
        </div>`
      };
    } else if (matched.length === 1) {
      AppState.unknownFeedback = {
        correct: false,
        message: `💡 <strong>เกือบถูกแล้ว! (ถูกต้อง 1 ชนิด จากที่เลือก ${guessedSymbols})</strong> — มี 1 ตัวที่อยู่ในหลอดตัวอย่างจริง แต่อีก 1 ตัวยังไม่ใช่ ลองตรวจสอบผลในหลอดที่แยกไว้อีกครั้ง หรือกดปุ่ม "👁️ เฉลย & วิธีแยกคู่นี้"`
      };
    } else {
      AppState.unknownFeedback = {
        correct: false,
        message: `❌ <strong>ยังไม่ถูกต้อง (0/2 ชนิด สำหรับ ${guessedSymbols})</strong> — ลองเริ่มหยด 6 M HCl เพื่อดูว่ามีกลุ่มที่ 1 ตกตะกอนขาวหรือไม่ แล้วแยกสารละลายไปตรวจกลุ่มที่ 2 ด้วย 6 M NaOH + 3% H₂O₂`
      };
    }
    renderApp();
    return;
  }

  // Single ion unknown check
  if (!AppState.unknownGuess) {
    AppState.unknownFeedback = {
      correct: false,
      message: "⚠️ กรุณาเลือกแคทไอออนจากรายการก่อนกดส่งคำตอบ"
    };
    renderApp();
    return;
  }
  const actual = AppState.secretUnknownIons[0];
  const actualInfo = window.CATION_DB[actual];
  if (AppState.unknownGuess === actual) {
    AppState.unknownRevealed = true;
    AppState.unknownFeedback = {
      correct: true,
      message: `🎉 ถูกต้อง! สารตัวอย่าง ${AppState.unknownCode} คือ ${actualInfo.symbol} (${actualInfo.thaiName}) — ${actualInfo.summary}`
    };
  } else {
    const guessedInfo = window.CATION_DB[AppState.unknownGuess];
    AppState.unknownFeedback = {
      correct: false,
      message: `❌ ยังไม่ถูกต้อง (${guessedInfo.symbol} ไม่ใช่ไอออนในหลอดนี้) ลองตรวจสอบผลในแต่ละขั้นตอนอีกครั้ง หรือกดเปิด X-Ray เพื่อดูใบ้`
    };
  }
  renderApp();
}

function deleteSelectedTube() {
  if (AppState.tubes.length <= 1) return;
  AppState.tubes.splice(AppState.selectedTubeIndex, 1);
  AppState.selectedTubeIndex = Math.max(0, AppState.selectedTubeIndex - 1);
  renderApp();
}

function toggleAllBlanks() {
  const keys = ["b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8"];
  const allOpen = keys.every(k => AppState.blankSheetRevealed[k]);
  keys.forEach(k => {
    AppState.blankSheetRevealed[k] = !allOpen;
  });
  renderApp();
}

function selectQuizOption(qId, oIdx) {
  if (AppState.quizSubmitted) return;
  AppState.quizAnswers[qId] = oIdx;
  renderApp();
}
